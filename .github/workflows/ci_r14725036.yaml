name: CI Pipeline
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Prettier Check
        run: npx prettier --check .

      - name: Run Tests
        id: run-tests
        run: npm test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/ # 或是你的測試報告路徑
